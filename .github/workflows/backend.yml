name: Deploy SocketHub API to AWS Lambda

on:
  push:
    branches: [ "main" ] # activates when code is merged to main
    paths:
      - 'backend/**' # Activated only when changes in ./backend

env:
  AWS_REGION: ap-southeast-2
  FUNCTION_NAME: sockethub-api

jobs:
  deploy:
    name: Package and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Set AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Zip source + production dependencies
    - name: Package Lambda
      run: ./backend/scripts/package-lambda.sh

    # Upload new code. Env vars (MONGO_URI, API keys) are managed by
    # Terraform in backend/terraform/lambda.tf, not by this workflow.
    - name: Deploy to Lambda
      run: |
        aws lambda update-function-code \
          --function-name "$FUNCTION_NAME" \
          --zip-file fileb://backend/lambda.zip
        aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

    # Fail the job if the deployed API doesn't answer
    - name: Smoke test
      run: |
        URL=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" --query FunctionUrl --output text)
        curl --fail --silent --show-error --max-time 30 "${URL}api/cafes" -o /dev/null
        echo "API OK"
